<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting — ToolNest</title>
    <script>
      // Single Page App redirect for GitHub Pages (preserves clean paths like /word-counter)
      (function () {
        var segmentCount = 0; // Set to 1 if deploying to https://username.github.io/repo-name/
        var l = window.location;
        var redirectUrl =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body></body>
</html>

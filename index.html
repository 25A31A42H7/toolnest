<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolNest – Free Online Tools for Everyone</title>
    <meta
      name="description"
      content="Powerful, simple, and free browser-based online tools for text editing, student calculators, YouTube creators, everyday math, and image optimization."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FAF8F4" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolNest" />
    <meta property="og:title" content="ToolNest – Free Online Tools for Everyone" />
    <meta
      property="og:description"
      content="Powerful, simple, and free browser-based online tools for text editing, student calculators, YouTube creators, everyday math, and image optimization."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolNest – Free Online Tools for Everyone" />
    <meta
      name="twitter:description"
      content="Powerful, simple, and free browser-based online tools for text editing, student calculators, YouTube creators, everyday math, and image optimization."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('toolnest-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F4] text-[#1C1B19] antialiased dark:bg-[#141312] dark:text-[#F5F2EB]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
